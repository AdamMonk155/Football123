<!DOCTYPE html>
.nojekyll
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Chain</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pitch:#0d1f0d;--surface:#132213;--card:#1a2e1a;--card2:#1f351f;
  --gold:#f5c842;--gold2:#e0a820;--cream:#f0ebe0;--ink:#080f08;
  --green:#2ecc71;--red:#e74c3c;--blue:#3498db;
  --muted:rgba(240,235,224,0.45);--faint:rgba(240,235,224,0.12);--border:rgba(240,235,224,0.09);
}
body{font-family:'Outfit',sans-serif;background:var(--pitch);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,0.025) 59px,rgba(255,255,255,0.025) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,0.025) 59px,rgba(255,255,255,0.025) 60px);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;width:100%;max-width:660px;padding:0 14px 80px}

/* HEADER */
header{text-align:center;padding:28px 0 16px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:4px;color:var(--gold);line-height:1}
.logo-sub{color:rgba(240,235,224,0.5);font-size:38px}
.tagline{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(240,235,224,0.35);margin-top:3px}
.mode-bar{display:flex;gap:8px;justify-content:center;margin-top:14px}
.mode-btn{background:var(--faint);border:1px solid var(--border);color:var(--muted);padding:5px 20px;border-radius:20px;font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.mode-btn.active,.mode-btn:hover{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}

/* INFINITE SCORE BOARD */
.score-board{display:none;margin:0 0 16px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:14px;padding:14px 18px;flex-direction:row;gap:0;align-items:stretch}
.score-board.visible{display:flex}
.score-col{flex:1;text-align:center;padding:0 10px}
.score-col+.score-col{border-left:1px solid var(--border)}
.score-val{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--gold);line-height:1}
.score-val.green{color:var(--green)}
.score-val.red{color:var(--red)}
.score-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,235,224,0.3);margin-top:2px}
.score-streak{font-size:11px;color:var(--muted);margin-top:4px}

/* BADGE */
.diff-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-top:6px}
.diff-easy{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.25)}
.diff-medium{background:rgba(245,200,66,0.15);color:var(--gold);border:1px solid rgba(245,200,66,0.25)}
.diff-hard{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid rgba(231,76,60,0.25)}
.diff-random{background:rgba(52,152,219,0.15);color:#5dade2;border:1px solid rgba(52,152,219,0.25)}

/* CHALLENGE BOARD */
.challenge-board{margin:20px 0 16px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;align-items:center}
.player-card{flex:1;text-align:center}
.player-avatar{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.player-card.start .player-avatar{background:linear-gradient(135deg,#1a6b3c,#27ae60);border:2px solid #27ae60;color:#fff}
.player-card.end .player-avatar{background:linear-gradient(135deg,#b8882b,#f5c842);border:2px solid #f5c842;color:var(--ink)}
.player-name{font-size:13px;font-weight:600;color:var(--cream);line-height:1.3}
.player-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,235,224,0.3);margin-bottom:5px}
.chain-arrow{flex:0 0 auto;padding:0 12px;color:rgba(240,235,224,0.18);font-size:26px}

/* STEPS */
.steps-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.steps-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.steps-dots{display:flex;gap:5px;flex:1}
.step-dot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,0.08);transition:background .4s}
.step-dot.used{background:var(--gold)}
.step-dot.win{background:var(--green)}
.step-dot.fail{background:var(--red)}

/* CHAIN */
.chain-list{display:flex;flex-direction:column;margin-bottom:14px}
.chain-node{display:flex;align-items:stretch}
.chain-connector{flex:0 0 38px;display:flex;flex-direction:column;align-items:center}
.chain-dot{width:11px;height:11px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:16px}
.chain-dot.start-dot{background:#27ae60}
.chain-dot.end-dot{background:#f5c842;box-shadow:0 0 8px rgba(245,200,66,0.6)}
.chain-line{flex:1;width:2px;background:rgba(245,200,66,0.15);margin:0 auto}
.chain-entry{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:11px;padding:11px 15px;margin:3px 0;animation:slideIn .3s ease}
.chain-entry.start-entry{border-color:rgba(39,174,96,0.25);background:rgba(39,174,96,0.06)}
.chain-entry.active-entry{border-color:rgba(245,200,66,0.35);background:rgba(245,200,66,0.05);box-shadow:0 0 0 1px rgba(245,200,66,0.12)}
.chain-entry.end-entry{border-color:rgba(245,200,66,0.5);background:rgba(245,200,66,0.08);box-shadow:0 0 12px rgba(245,200,66,0.15)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.entry-top{display:flex;align-items:center;justify-content:space-between}
.entry-player{font-size:14px;font-weight:600;color:var(--cream)}
.entry-nat{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.entry-link{font-size:11px;color:var(--gold);margin-top:2px;font-family:'JetBrains Mono',monospace}
.entry-link.start-link{color:#27ae60}
.entry-link.end-link{color:var(--gold)}

/* ACTIVE LABEL */
.active-label-bar{margin-bottom:9px}
.active-label{font-size:13px;color:var(--muted)}
.active-label strong{color:var(--gold);font-weight:600}

/* FEEDBACK */
.feedback{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none;animation:fadeIn .2s ease;line-height:1.5}
.feedback.error{display:block;background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.28);color:#e57373}
.feedback.success{display:block;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.25);color:#66bb6a}
.feedback.loading{display:block;background:rgba(52,152,219,0.1);border:1px solid rgba(52,152,219,0.2);color:#5dade2}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

/* INPUT */
.input-section{position:relative;margin-bottom:10px}
.guess-input{width:100%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:11px;padding:13px 115px 13px 16px;font-family:'Outfit',sans-serif;font-size:15px;color:var(--cream);outline:none;transition:border-color .2s,box-shadow .2s}
.guess-input::placeholder{color:rgba(240,235,224,0.28)}
.guess-input:focus{border-color:rgba(245,200,66,0.45);box-shadow:0 0 0 3px rgba(245,200,66,0.07)}
.guess-input:disabled{opacity:.5;cursor:not-allowed}
.submit-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:var(--gold);color:var(--ink);border:none;border-radius:8px;padding:7px 16px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.submit-btn:hover{background:#e0a820}
.submit-btn:active{transform:translateY(-50%) scale(.97)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-badge{font-size:9px;background:rgba(15,26,15,0.4);padding:2px 5px;border-radius:4px;letter-spacing:.5px}

/* AUTOCOMPLETE */
.autocomplete{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a2e1a;border:1px solid rgba(255,255,255,0.1);border-radius:11px;overflow:hidden;z-index:100;box-shadow:0 8px 28px rgba(0,0,0,0.5);display:none}
.ac-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--cream);border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:9px;transition:background .1s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.hl{background:rgba(245,200,66,0.09)}
.ac-avatar{width:28px;height:28px;border-radius:50%;background:rgba(245,200,66,0.12);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;font-family:'JetBrains Mono',monospace}
.ac-info{flex:1;min-width:0}
.ac-name{font-weight:500;font-size:13px}
.ac-clubs{font-size:10px;color:rgba(240,235,224,0.38);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-nat{font-size:10px;color:var(--muted);margin-left:auto;flex-shrink:0;font-family:'JetBrains Mono',monospace}

/* AI INDICATOR */
.ai-indicator{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;padding:6px 10px;background:rgba(52,152,219,0.06);border:1px solid rgba(52,152,219,0.12);border-radius:7px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:#3498db;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* RESULT */
.result-screen{display:none;text-align:center;padding:28px 18px;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:18px;margin-top:14px;animation:fadeIn .4s ease}
.result-screen.visible{display:block}
.result-emoji{font-size:52px;margin-bottom:10px;line-height:1}
.result-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.result-subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}

/* SCORE RATING */
.score-rating{display:inline-flex;flex-direction:column;align-items:center;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:14px;padding:16px 28px;margin:12px auto 16px}
.score-rating-stars{font-size:28px;letter-spacing:4px;margin-bottom:6px}
.score-rating-pts{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:2px;color:var(--gold);line-height:1}
.score-rating-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(240,235,224,0.3);margin-top:3px}
.score-rating-desc{font-size:12px;color:var(--muted);margin-top:6px}

.result-btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn-primary{background:var(--gold);color:var(--ink);border:none;border-radius:9px;padding:11px 24px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#e0a820}
.btn-secondary{background:rgba(255,255,255,0.06);color:var(--cream);border:1px solid var(--border);border-radius:9px;padding:11px 24px;font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.share-box{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cream);margin:14px 0;white-space:pre;text-align:left;line-height:1.9}

/* SHUFFLE BTN */
.shuffle-btn{display:none;margin:0 auto 14px;background:rgba(245,200,66,0.1);border:1px dashed rgba(245,200,66,0.35);color:var(--gold);padding:7px 20px;border-radius:20px;font-family:'Outfit',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .2s;gap:6px;align-items:center}
.shuffle-btn:hover{background:rgba(245,200,66,0.18);border-color:rgba(245,200,66,0.6)}
.shuffle-btn.visible{display:flex}
@keyframes spin-once{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.shuffle-btn.spinning .shuffle-icon{animation:spin-once .4s ease}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s ease}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(245,200,66,0.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Transfer<span class="logo-sub">⚽</span>Chain</div>
    <div class="tagline">Link players through shared clubs · 6 steps</div>
    <div class="mode-bar">
      <button class="mode-btn active" id="btn-daily" onclick="setMode('daily')">Daily</button>
      <button class="mode-btn" id="btn-infinite" onclick="setMode('infinite')">Random</button>
    </div>
  </header>

  <!-- Infinite mode score board -->
  <div class="score-board" id="score-board">
    <div class="score-col">
      <div class="score-val" id="sb-total">0</div>
      <div class="score-label">Total Score</div>
    </div>
    <div class="score-col">
      <div class="score-val green" id="sb-wins">0</div>
      <div class="score-label">Wins</div>
    </div>
    <div class="score-col">
      <div class="score-val red" id="sb-losses">0</div>
      <div class="score-label">Losses</div>
    </div>
    <div class="score-col">
      <div class="score-val" id="sb-streak">0</div>
      <div class="score-label">Streak 🔥</div>
    </div>
  </div>

  <button class="shuffle-btn" id="shuffle-btn" onclick="shufflePlayers()">
    <span class="shuffle-icon" style="font-size:14px">🔀</span> New random pair
  </button>

  <div class="challenge-board">
    <div class="player-card start">
      <div class="player-label">Start</div>
      <div class="player-avatar" id="start-avatar">—</div>
      <div class="player-name" id="start-name">—</div>
    </div>
    <div class="chain-arrow">→</div>
    <div class="player-card end">
      <div class="player-label">Target</div>
      <div class="player-avatar" id="end-avatar">—</div>
      <div class="player-name" id="end-name">—</div>
    </div>
  </div>

  <div class="steps-row">
    <span class="steps-label">Steps</span>
    <div class="steps-dots" id="steps-dots"></div>
  </div>

  <div class="chain-list" id="chain-list"></div>

  <div class="active-label-bar" id="active-label-bar">
    <span class="active-label">Find a teammate of <strong id="active-name">—</strong></span>
  </div>

  <div id="ai-indicator" class="ai-indicator" style="display:none">
    <div class="ai-dot"></div>
    <span>AI verifying connection…</span>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="input-section" id="input-section">
    <input type="text" class="guess-input" id="guess-input" placeholder="Player name…" autocomplete="off"
      oninput="handleInput(this.value)" onkeydown="handleKeydown(event)">
    <button class="submit-btn" onclick="submitGuess()" id="submit-btn">
      Submit <span class="ai-badge">AI</span>
    </button>
    <div class="autocomplete" id="autocomplete"></div>
  </div>

  <div class="result-screen" id="result-screen"></div>
</div>

<script>

// ════════════════════════════════════════════════════════
// SCORING SYSTEM
// Steps used → points earned
// 1 step = 100 pts (perfect), 2 = 85, 3 = 70, 4 = 55, 5 = 40, 6 = 25
// Loss = 0 pts
// ════════════════════════════════════════════════════════
const STEP_SCORES = [0, 100, 85, 70, 55, 40, 25];
const STEP_RATINGS = [
  {stars:"⭐⭐⭐⭐⭐", label:"Telepathic", desc:"You must be a scout!"},
  {stars:"⭐⭐⭐⭐⭐", label:"Telepathic", desc:"You must be a scout!"},

];

// ════════════════════════════════════════════════════════
// INFINITE MODE SCORE STATE
// ════════════════════════════════════════════════════════
let infiniteScore = {total:0, wins:0, losses:0, streak:0};

// ════════════════════════════════════════════════════════
// LOCAL CONNECTION CHECK
// ════════════════════════════════════════════════════════
function getSharedClub(a, b) {
  const da = PLAYER_DB[a], db = PLAYER_DB[b];
  if (!da || !db) return null;
  for (const ca of da.clubs) {
    for (const cb of db.clubs) {
      if (ca.club === cb.club) {
        const s = Math.max(ca.from, cb.from), e = Math.min(ca.to, cb.to);
        if (s < e) return {club:ca.club, from:s, to:e};
      }
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════
// AI VERIFICATION
// ════════════════════════════════════════════════════════
async function aiVerifyConnection(playerA, playerB) {
  const aData = PLAYER_DB[playerA];
  const bData = PLAYER_DB[playerB];
  const aClubs = aData ? aData.clubs.map(c=>`${c.club} (${c.from}-${c.to})`).join(', ') : 'unknown';
  const bClubs = bData ? bData.clubs.map(c=>`${c.club} (${c.from}-${c.to})`).join(', ') : 'unknown';

  const prompt = `You are verifying football transfer connections for a game. 
Player A: ${playerA}
Known clubs of A: ${aClubs}
Player B: ${playerB}  
Known clubs of B: ${bClubs}

Did ${playerA} and ${playerB} play at the SAME CLUB during the SAME SEASON (even briefly, including loans)?
Respond with ONLY valid JSON:
{"connected": true/false, "club": "Club Name or null", "from": year_or_null, "to": year_or_null, "confidence": "high/medium/low", "note": "brief explanation"}`;

  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:300,
        system:"You are a football encyclopedia with knowledge up to 2025. Always respond with valid JSON only.",
        messages:[{role:"user",content:prompt}]
      })
    });
    const data = await resp.json();
    const text = data.content.map(i=>i.text||"").join("").replace(/```json|```/g,"").trim();
    return JSON.parse(text);
  } catch(e) { return null; }
}

// ════════════════════════════════════════════════════════
// RESOLVE INPUT
// ════════════════════════════════════════════════════════
function resolveInput(val) {
  const q = val.trim().toLowerCase();
  if (!q) return null;
  const exact = PLAYER_NAMES.find(n => n.toLowerCase() === q);
  if (exact) return exact;
  const surname = PLAYER_NAMES.filter(n => {
    const parts = n.split(' ');
    return parts[parts.length-1].toLowerCase() === q;
  });
  if (surname.length === 1) return surname[0];
  if (surname.length > 1) return 'AMBIG:' + surname.join('|');
  const starts = PLAYER_NAMES.filter(n => n.toLowerCase().includes(q));
  if (starts.length === 1) return starts[0];
  if (starts.length > 1 && starts.length < 5) return 'AMBIG:' + starts.join('|');
  return val;
}

// ════════════════════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════════════════════
let state = {mode:'daily',startPlayer:'',endPlayer:'',chain:[],stepsUsed:0,maxSteps:6,over:false,diff:'medium'};
let hlIdx = -1, filtered = [], isLoading = false;

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
function setMode(mode) {
  state.mode = mode;
  document.getElementById('btn-daily').classList.toggle('active', mode==='daily');
  document.getElementById('btn-infinite').classList.toggle('active', mode==='infinite');
  document.getElementById('shuffle-btn').classList.toggle('visible', mode==='infinite');
  document.getElementById('score-board').classList.toggle('visible', mode==='infinite');
  if (mode==='infinite') updateScoreBoard();
  initGame();
}

function pickRandomPair() {
  const pool = PLAYER_NAMES.filter(n => PLAYER_DB[n]?.clubs?.length >= 2);
  let start, end, attempts = 0;
  do {
    start = pool[Math.floor(Math.random() * pool.length)];
    end   = pool[Math.floor(Math.random() * pool.length)];
    attempts++;
  } while ((start === end || getSharedClub(start, end)) && attempts < 100);
  return {start, end, diff:'random'};
}

function shufflePlayers() {
  if (state.mode !== 'infinite') return;
  const btn = document.getElementById('shuffle-btn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 400);
  initGame();
}

function initGame() {
  let puzzle;
  if (state.mode==='daily') {
    const day = Math.floor(Date.now()/86400000);
    puzzle = PUZZLES[day % PUZZLES.length];
  } else {
    puzzle = pickRandomPair();
  }
  state.startPlayer = puzzle.start;
  state.endPlayer   = puzzle.end;
  // chain entries: {name, connection, note}
  state.chain       = [{ name: puzzle.start, connection: null, note: null }];
  state.stepsUsed   = 0;
  state.over        = false;
  state.diff        = puzzle.diff;
  document.getElementById('guess-input').value = '';
  closeAC();
  hideFeedback();
  renderAll();
}

function ini(name) {
  return (PLAYER_DB[name]?.ini) || name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
}

// *** KEY FIX: check against last entry's name, not object identity ***
function isWon() {
  if (state.chain.length < 2) return false;
  const last = state.chain[state.chain.length - 1];
  const lastName = typeof last === 'object' ? last.name : last;
  return lastName.trim().toLowerCase() === state.endPlayer.trim().toLowerCase();
}

function renderAll() {
  document.getElementById('start-avatar').textContent = ini(state.startPlayer);
  document.getElementById('start-name').textContent   = state.startPlayer;
  document.getElementById('end-avatar').textContent   = ini(state.endPlayer);
  document.getElementById('end-name').textContent     = state.endPlayer;

  const won = isWon();
  const dotsEl = document.getElementById('steps-dots');
  dotsEl.innerHTML = '';
  for (let i=0;i<state.maxSteps;i++) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i<state.stepsUsed ? (' '+(state.over?(won?'win':'fail'):'used')) : '');
    dotsEl.appendChild(d);
  }

  renderChain();

  const lastEntry = state.chain[state.chain.length - 1];
  const activeName = typeof lastEntry === 'object' ? lastEntry.name : lastEntry;
  document.getElementById('active-name').textContent = activeName;
  document.getElementById('input-section').style.display  = state.over ? 'none' : 'block';
  document.getElementById('active-label-bar').style.display = state.over ? 'none' : 'block';
  document.getElementById('result-screen').classList.toggle('visible', state.over);
  if (state.over) renderResult();
}

function renderChain() {
  const list = document.getElementById('chain-list');
  list.innerHTML = '';
  const won = isWon();

  state.chain.forEach((entry, i) => {
    const player = typeof entry === 'object' ? entry.name : entry;
    const conn   = typeof entry === 'object' ? entry.connection : null;
    const note   = typeof entry === 'object' ? entry.note : null;
    const isLast = i === state.chain.length - 1;
    const isTarget = player.trim().toLowerCase() === state.endPlayer.trim().toLowerCase();

    const node = document.createElement('div');
    node.className = 'chain-node';

    const connEl = document.createElement('div');
    connEl.className = 'chain-connector';
    const dot = document.createElement('div');
    dot.className = 'chain-dot' + (i===0 ? ' start-dot' : '') + (isTarget && won ? ' end-dot' : '');
    connEl.appendChild(dot);
    if (i < state.chain.length - 1) {
      const line = document.createElement('div');
      line.className = 'chain-line';
      connEl.appendChild(line);
    }

    const entryEl = document.createElement('div');
    const isActive = isLast && !state.over;
    entryEl.className = 'chain-entry'
      + (i===0 ? ' start-entry' : '')
      + (isActive ? ' active-entry' : '')
      + (isTarget && won && state.over ? ' end-entry' : '');

    const top = document.createElement('div');
    top.className = 'entry-top';
    const nameEl = document.createElement('div');
    nameEl.className = 'entry-player';
    nameEl.textContent = player;
    const natEl = document.createElement('div');
    natEl.className = 'entry-nat';
    natEl.textContent = PLAYER_DB[player]?.nat || '';
    top.appendChild(nameEl); top.appendChild(natEl);
    entryEl.appendChild(top);

    const linkEl = document.createElement('div');
    linkEl.className = 'entry-link' + (i===0 ? ' start-link' : '') + (isTarget && won ? ' end-link' : '');
    if (i===0) {
      linkEl.textContent = '▶ Starting player';
    } else if (isTarget && won) {
      linkEl.textContent = conn ? `🏆 ${conn.club} · ${conn.from}–${conn.to}` : `🏆 ${note || 'AI verified — Target reached!'}`;
    } else {
      linkEl.textContent = conn ? `↳ ${conn.club} · ${conn.from}–${conn.to}` : `↳ ${note || 'AI verified'}`;
    }
    entryEl.appendChild(linkEl);
    node.appendChild(connEl); node.appendChild(entryEl);
    list.appendChild(node);
  });
}

function renderResult() {
  const won = isWon();
  const el = document.getElementById('result-screen');
  const steps = state.stepsUsed;
  const pts = won ? STEP_SCORES[Math.min(steps, 6)] : 0;
  const rating = won ? STEP_RATINGS[Math.min(steps, 6)] : null;

  const dots = won
    ? '🟩'.repeat(steps) + '⬜'.repeat(state.maxSteps - steps)
    : '🟥'.repeat(steps);
  const shareStr = `⚽ TransferChain\n${state.startPlayer} → ${state.endPlayer}\n${dots}\n${won ? `${steps}/${state.maxSteps} steps · ${pts} pts` : 'Out of steps'}`;
  const diff = state.diff || 'medium';
  const isRandom = state.mode === 'infinite';

  el.innerHTML = `
    <div class="result-emoji">${won ? '🏆' : '😔'}</div>
    <div class="result-title">${won ? 'Connected!' : 'Chain broken'}</div>
    <div class="result-subtitle">${won
      ? `Linked in ${steps} step${steps !== 1 ? 's' : ''}!`
      : `Couldn't link ${state.startPlayer} → ${state.endPlayer}.`
    }</div>
    <span class="diff-badge diff-${diff}">${diff}</span>
    ${won ? `
    <div class="score-rating">
      <div class="score-rating-stars">${rating.stars}</div>
      <div class="score-rating-pts">${pts}</div>
      <div class="score-rating-label">points earned</div>
      <div class="score-rating-desc">${rating.label} — ${rating.desc}</div>
    </div>` : `<div style="margin:16px 0;font-size:13px;color:var(--muted)">Better luck next time.</div>`}
    <div class="share-box" id="share-str">${shareStr}</div>
    <div class="result-btns">
      <button class="btn-primary" onclick="copyShare()">📋 Copy result</button>
      <button class="btn-secondary" onclick="initGame()">${isRandom ? '🔀 Next pair' : 'New game ↻'}</button>
    </div>`;
}

// ════════════════════════════════════════════════════════
// AUTOCOMPLETE
// ════════════════════════════════════════════════════════
function handleInput(val) {
  hideFeedback();
  if (!val.trim() || val.length < 2) { closeAC(); return; }
  const q = val.toLowerCase();
  const currentEntry = state.chain[state.chain.length - 1];
  const currentName = typeof currentEntry === 'object' ? currentEntry.name : currentEntry;
  const chainNames = state.chain.map(e => typeof e === 'object' ? e.name : e);

  filtered = PLAYER_NAMES.filter(n =>
    (n.toLowerCase().includes(q) || n.split(' ').some(w => w.toLowerCase().startsWith(q)))
    && n !== currentName && !chainNames.includes(n)
  ).slice(0, 8);
  hlIdx = -1;
  renderAC();
}

function renderAC() {
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = ''; ac.style.display = filtered.length ? 'block' : 'none';
  const NATIONAL = new Set(['Portugal','France','Spain','England','Brazil','Argentina','Germany','Italy','Netherlands','Belgium','Croatia','Wales','Norway','Poland','South Korea','Egypt','Senegal','Cameroon','Chile','Uruguay','Denmark','Sweden','Czech Republic','Ivory Coast','Republic of Ireland','Morocco','Georgia','Algeria','Colombia','Serbia','Turkey','Austria','Switzerland','Armenia']);
  filtered.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'ac-item' + (i===hlIdx?' hl':'');
    const av = document.createElement('div');
    av.className = 'ac-avatar'; av.textContent = ini(name).slice(0,3);
    const info = document.createElement('div');
    info.className = 'ac-info';
    const ne = document.createElement('div');
    ne.className = 'ac-name'; ne.textContent = name;
    const cl = document.createElement('div');
    cl.className = 'ac-clubs';
    cl.textContent = (PLAYER_DB[name]?.clubs||[]).filter(c=>!NATIONAL.has(c.club)).map(c=>c.club).join(' · ');
    info.appendChild(ne); info.appendChild(cl);
    const nat = document.createElement('div');
    nat.className = 'ac-nat'; nat.textContent = PLAYER_DB[name]?.nat||'';
    item.appendChild(av); item.appendChild(info); item.appendChild(nat);
    item.addEventListener('mousedown', e => { e.preventDefault(); selectSug(name); });
    ac.appendChild(item);
  });
}

function closeAC() { document.getElementById('autocomplete').style.display='none'; filtered=[]; hlIdx=-1; }
function selectSug(name) { document.getElementById('guess-input').value=name; closeAC(); }

function handleKeydown(e) {
  if (e.key==='ArrowDown') { e.preventDefault(); hlIdx=Math.min(hlIdx+1,filtered.length-1); renderAC(); }
  else if (e.key==='ArrowUp') { e.preventDefault(); hlIdx=Math.max(hlIdx-1,-1); renderAC(); }
  else if (e.key==='Enter') { filtered[hlIdx] ? selectSug(filtered[hlIdx]) : submitGuess(); }
  else if (e.key==='Escape') closeAC();
}
document.addEventListener('click', e => { if (!e.target.closest('#input-section')) closeAC(); });

// ════════════════════════════════════════════════════════
// SUBMIT
// ════════════════════════════════════════════════════════
async function submitGuess() {
  if (isLoading) return;
  const input = document.getElementById('guess-input');
  const val = input.value.trim();
  if (!val) return;

  const resolved = resolveInput(val);
  if (!resolved) {
    showFeedback(`"${val}" not found. Try a different spelling.`, 'error');
    shakeInput(); return;
  }
  if (resolved.startsWith('AMBIG:')) {
    const opts = resolved.slice(6).split('|').slice(0,3).join(', ');
    showFeedback(`Multiple matches: ${opts} — be more specific.`, 'error');
    shakeInput(); return;
  }

  const match = resolved;
  const currentEntry = state.chain[state.chain.length - 1];
  const current = typeof currentEntry === 'object' ? currentEntry.name : currentEntry;

  if (match === current) { showFeedback('That\'s already the active player!','error'); shakeInput(); return; }

  const chainNames = state.chain.map(e => typeof e === 'object' ? e.name : e);
  if (chainNames.includes(match)) { showFeedback(`${match} is already in your chain.`,'error'); shakeInput(); return; }

  // 1. Local DB check (fast)
  const localConn = getSharedClub(current, match);
  if (localConn) {
    addToChain(match, localConn);
    return;
  }

  // 2. AI fallback
  setLoading(true);
  document.getElementById('feedback').innerHTML = '<span class="spinner"></span> Verifying with AI…';
  document.getElementById('feedback').className = 'feedback loading';
  document.getElementById('feedback').style.display = 'block';
  document.getElementById('ai-indicator').style.display = 'flex';

  const aiResult = await aiVerifyConnection(current, match);
  setLoading(false);
  document.getElementById('ai-indicator').style.display = 'none';

  if (!aiResult) {
    showFeedback('Could not verify — please try again.', 'error');
    return;
  }

  if (aiResult.connected && aiResult.confidence !== 'low') {
    const conn = aiResult.club ? {club:aiResult.club, from:aiResult.from||'?', to:aiResult.to||'?'} : null;
    addToChain(match, conn, aiResult.note);
  } else {
    showFeedback(`${current} and ${match} never played together. ${aiResult.note || 'Try again.'}`, 'error');
    shakeInput();
  }
}

function addToChain(match, conn, note) {
  state.chain.push({ name: match, connection: conn, note: note || null });
  state.stepsUsed++;
  document.getElementById('guess-input').value = '';
  closeAC();

  // *** WIN CHECK: compare names, not object identity ***
  const won = match.trim().toLowerCase() === state.endPlayer.trim().toLowerCase();

  if (won || state.stepsUsed >= state.maxSteps) {
    state.over = true;

    // Update infinite score
    if (state.mode === 'infinite') {
      if (won) {
        const pts = STEP_SCORES[Math.min(state.stepsUsed, 6)];
        infiniteScore.total += pts;
        infiniteScore.wins++;
        infiniteScore.streak++;
      } else {
        infiniteScore.losses++;
        infiniteScore.streak = 0;
      }
      updateScoreBoard();
    }

    renderAll();
    return;
  }

  // Auto-complete: check if the newly added player is directly connected to the end player
  const autoConn = getSharedClub(match, state.endPlayer);
  if (autoConn && state.stepsUsed < state.maxSteps) {
    // Brief pause so the user sees their step land first
    renderAll();
    const connStr = conn ? `via ${conn.club} (${conn.from}–${conn.to})` : (note || 'AI verified');
    showFeedback(`✓ Connected ${connStr}! Auto-linking to ${state.endPlayer}…`, 'success');
    setTimeout(() => {
      state.chain.push({ name: state.endPlayer, connection: autoConn, note: null });
      state.stepsUsed++;
      state.over = true;
      if (state.mode === 'infinite') {
        const pts = STEP_SCORES[Math.min(state.stepsUsed, 6)];
        infiniteScore.total += pts;
        infiniteScore.wins++;
        infiniteScore.streak++;
        updateScoreBoard();
      }
      renderAll();
    }, 700);
    return;
  }

  renderAll();
  const connStr = conn ? `via ${conn.club} (${conn.from}–${conn.to})` : (note || 'AI verified');
  showFeedback(`✓ Connected ${connStr}! Keep going — ${state.maxSteps - state.stepsUsed} steps left.`, 'success');
}

function setLoading(v) {
  isLoading = v;
  document.getElementById('submit-btn').disabled = v;
  document.getElementById('guess-input').disabled = v;
}

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function showFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg; el.className = 'feedback '+type;
}
function hideFeedback() {
  const el = document.getElementById('feedback');
  el.style.display='none'; el.className='feedback';
}
function shakeInput() {
  const i = document.getElementById('guess-input');
  i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake');
}
function copyShare() {
  const text = document.getElementById('share-str').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = event.target; btn.textContent='✅ Copied!';
    setTimeout(()=>btn.textContent='📋 Copy result',2000);
  });
}

initGame();
</script>
</body>
</html>
